    <style>
        html {

        /* Custom Scrollbar */

        }

        }

        /* Glass Container & Inputs */
        .glass-container {
            background: rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);

            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.25s ease;
        }

        .glass-input:focus-within {
            outline: none;
            border-color: #8B5CF6;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
        }

        .gradient-btn {
            background: linear-gradient(135deg, #8B5CF6 0%, #A78BFA 100%);
            transition: all 0.3s ease;
        }

        .gradient-btn:hover {
            box-shadow: 0 10px 28px rgba(139, 92, 246, 0.45);
            transform: translateY(-1px);
        }

        .gradient-btn:active {
            transform: translateY(0) scale(0.99);
        }

        /* Ambient glow blobs */
        .glow-blob {
            pointer-events: none;
            position: absolute;
            border-radius: 9999px;
            filter: blur(120px);
        }

        /* Mobile Nav Drawer animation helper */
        .mobile-nav-panel {
            display: none;
            background: rgba(12, 19, 36, 0.95);
            backdrop-filter: blur(24px);
        }

        .mobile-nav-panel.open {
            display: block;
        }

        /* Field entrance targets start hidden to avoid FOUC before GSAP runs */
        .anim-field {
            opacity: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            .anim-field {
                opacity: 1;
            }
        }

    <script>
        // Mobile Drawer Toggle
        const navToggle = document.getElementById('navToggle');
        const mobileNavPanel = document.getElementById('mobileNavPanel');
        const navIconOpen = document.getElementById('navIconOpen');
        const navIconClose = document.getElementById('navIconClose');

        navToggle.addEventListener('click', () => {
            const isOpen = mobileNavPanel.classList.toggle('open');
            navToggle.setAttribute('aria-expanded', isOpen);
            navIconOpen.classList.toggle('hidden', isOpen);
            navIconClose.classList.toggle('hidden', !isOpen);
        });

        // Entrance Animation — hero, then form container, then staggered fields
        const heroTl = gsap.timeline({ defaults: { ease: 'power3.out' } });

        heroTl
            .from('#heroTitle', { opacity: 0, y: 22, duration: 0.7 })
            .from('#heroArc', {
                opacity: 0,
                scale: 0.82,
                duration: 0.6,
                ease: 'back.out(1.7)',
                transformOrigin: 'center'
            }, '-=0.3')
            .from('#formContainer', { opacity: 0, y: 40, duration: 0.8, ease: 'power2.out' }, '-=0.2')
            .to('.anim-field', {
                opacity: 1,
                y: 0,
                duration: 0.55,
                stagger: 0.09,
                ease: 'power2.out'
            }, '-=0.35');

        // Set initial offset for fields (paired with .anim-field { opacity: 0 } in CSS)
        gsap.set('.anim-field', { y: 16 });
    </script>

</body>
